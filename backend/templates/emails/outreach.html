<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="color-scheme" content="light only" />
<title>{{ subject }}</title>
<!--[if !mso]><!-->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<!--<![endif]-->
<style>
  html, body { margin: 0 !important; padding: 0 !important; }
  * { -ms-text-size-adjust: 100%; -webkit-text-size-adjust: 100%; }
  table, td { mso-table-lspace: 0pt !important; mso-table-rspace: 0pt !important; border-collapse: collapse !important; }
  a { text-decoration: none; }
  .px { padding-left: 40px; padding-right: 40px; }
  @media only screen and (max-width: 600px) {
    .container { width: 100% !important; }
    .px { padding-left: 24px !important; padding-right: 24px !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; width:100%; background-color:#F3F4F6;">
<!-- Preheader -->
<div style="display:none; max-height:0; overflow:hidden; opacity:0;">{{ company_name }} has a role for you</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F3F4F6;">
  <tr>
    <td align="center" style="padding:32px 12px;">
      <!--[if mso]><table role="presentation" align="center" cellpadding="0" cellspacing="0" border="0" width="600"><tr><td><![endif]-->
      <table role="presentation" class="container" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#FFFFFF; border-radius:8px; overflow:hidden;">

        <!-- HEADER: Company name on blue gradient -->
        <tr>
          <td class="px" style="background-color:#1C3477; background-image:linear-gradient(135deg,#1C3477,#5465FF); padding:24px 40px;">
            <p style="margin:0; font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:18px; font-weight:700; color:#FFFFFF; letter-spacing:0.5px;">
              {{ company_name }}
            </p>
          </td>
        </tr>

        <!-- BODY -->
        <tr>
          <td class="px" style="padding:32px 40px;">
            <div style="font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.7; color:#3B3F5C;">
              {{ body|safe }}
            </div>
          </td>
        </tr>

        {% if job_link %}
        <tr>
          <td class="px" style="padding:0 40px 32px 40px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="background-color:#5465FF; border-radius:6px;">
                  <a href="{{ job_link }}" target="_blank" style="display:inline-block; padding:12px 28px; font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:14px; font-weight:600; color:#FFFFFF; text-decoration:none;">View Role and Apply</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
        {% endif %}

      </table>
      <!--[if mso]></td></tr></table><![endif]-->
    </td>
  </tr>
</table>
</body>
</html>
