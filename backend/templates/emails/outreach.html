{% extends "emails/base.html" %}
{% block title %}{{ subject }}{% endblock %}
{% block preheader %}{{ company_name }} wants to connect with you{% endblock %}
{% block content %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.7; color:#3B3F5C;">
      {{ body|safe }}
    </td>
  </tr>
  <tr>
    <td style="padding-top:28px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr><td style="border-top:1px solid #E5E7EB; font-size:0; line-height:0; height:1px;">&nbsp;</td></tr></table>
    </td>
  </tr>
  <tr>
    <td style="padding-top:20px; font-family:'Inter',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:13px; line-height:1.6; color:#9AA6D4;">
      Sent by <strong style="color:#3B3F5C;">{{ company_name }}</strong> via <a href="https://www.tiaago.com" style="color:#5465FF; font-weight:600;">Tiaago</a>
    </td>
  </tr>
</table>
{% endblock %}
