{% load static %}
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Certificate</title>
</head>
<body style="margin:0;padding:0;font-family:Arial, Helvetica, sans-serif;">

<!-- Full page container (A4 landscape at ~96dpi ≈ 1123x794) -->
<div style="
  position:relative;
  width:1123px; height:794px;
  background:url('{% static 'certificates/template.png' %}') center center / cover no-repeat;
">

  <!-- A soft white panel to keep text readable -->
  <div style="
    position:absolute; left:40px; right:40px; top:40px; bottom:40px;
    border:2px solid #d1d5db; border-radius:16px;
    background-color:rgba(255,255,255,0.92);
    box-sizing:border-box; padding:40px;
  ">

    <!-- Use a single-cell table to center content vertically & horizontally -->
    <table role="presentation" cellspacing="0" cellpadding="0" border="0"
           style="width:100%; height:100%; border-collapse:collapse; table-layout:fixed;">
      <tr>
        <td style="text-align:center; vertical-align:middle;">

          <!-- Heading (avoid letter-spacing) -->
          <div style="font-size:22px; font-weight:bold; color:#1f2937; margin:0 0 20px 0;">
            CERTIFICATE OF COMPLETION
          </div>

          <!-- Recipient Name -->
          <div style="font-size:48px; font-weight:800; color:#111827; line-height:1.1; margin:0 0 10px 0;">
            {{ full_name }}
          </div>

          <!-- Subtitle -->
          <div style="font-size:16px; color:#4b5563; margin:0 0 6px 0;">
            has successfully completed
          </div>

          <!-- Assessment Title -->
          <div style="font-size:24px; font-weight:600; color:#111827; margin:0 0 24px 0;">
            {{ assessment_title }}
          </div>

          <!-- Meta row -->
          <div style="font-size:14px; color:#374151; margin:0 auto; display:inline-block;">
            <div style="margin:4px 0;">
              <span style="opacity:0.85;">Date:</span>
              <strong>{{ completed_date }}</strong>
            </div>

            {% if issuer %}
            <div style="margin:4px 0;">
              <span style="opacity:0.85;">Issued by:</span>
              <strong>{{ issuer }}</strong>
            </div>
            {% endif %}
          </div>

          <!-- Signature lines (optional) -->
          <div style="width:100%; max-width:900px; margin:32px auto 0 auto;">
            <table role="presentation" cellspacing="0" cellpadding="0" border="0" style="width:100%;">
              <tr>
                <td style="width:50%; text-align:center; padding:0 10px;">
                  <div style="border-bottom:1px solid #9ca3af; height:0; margin:0 40px 6px 40px;"></div>
                  <div style="font-size:12px; color:#6b7280;">Authorized Signatory</div>
                </td>
                <td style="width:50%; text-align:center; padding:0 10px;">
                  <div style="border-bottom:1px solid #9ca3af; height:0; margin:0 40px 6px 40px;"></div>
                  <div style="font-size:12px; color:#6b7280;">Recipient</div>
                </td>
              </tr>
            </table>
          </div>

          <!-- Optional ID
          <div style="font-size:11px; color:#6b7280; margin-top:18px;">
            Certificate ID: {{ certificate_id }}
          </div>
          -->

        </td>
      </tr>
    </table>

  </div>
</div>

</body>
</html>
