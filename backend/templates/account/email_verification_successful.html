<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verified — Tiaago</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: #F1F5F9;
            font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .card {
            width: 100%;
            max-width: 480px;
            background-color: #FFFFFF;
            border: 1px solid #E2E8F0;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
        }
        .logo {
            height: 36px;
            width: auto;
            margin-bottom: 28px;
        }
        .icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background-color: #ECFDF3;
            color: #027A48;
            font-size: 30px;
            line-height: 64px;
            font-weight: 700;
        }
        h1 {
            font-size: 24px;
            line-height: 32px;
            font-weight: 700;
            color: #0F172A;
            margin-bottom: 12px;
        }
        p {
            font-size: 15px;
            line-height: 24px;
            color: #475569;
            margin-bottom: 28px;
        }
        .btn {
            display: inline-block;
            padding: 13px 36px;
            background-color: #5465FF;
            color: #FFFFFF;
            font-size: 15px;
            font-weight: 600;
            line-height: 20px;
            text-decoration: none;
            border-radius: 8px;
            transition: background-color 0.15s ease;
        }
        .btn:hover { background-color: #3A47B8; }
    </style>
</head>
<body>
    <div class="card">
        <img class="logo" src="{{ logo_url|default:'https://tiaago-backend-web.onrender.com/static/emails/assets/Tiaago_logo.png' }}" alt="Tiaago">
        <div class="icon">&#10003;</div>
        <h1>Email Verification Successful</h1>
        <p>Thank you for verifying your email address. Your Tiaago account is now active and ready to use.</p>
        <a href="https://www.tiaago.com/talents/signin" id="loginButton" class="btn">Login to Tiaago</a>
    </div>
    <script>
        document.getElementById("loginButton").addEventListener("click", function() {
            window.location.href = "https://www.tiaago.com/talents/signin";
        });
    </script>
</body>
</html>
