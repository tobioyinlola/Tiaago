worker_processes  auto;

events { worker_connections  1024; }

http {
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  include       mime.types;
  default_type  application/octet-stream;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen       ${PORT};
    server_name  _;

    client_max_body_size 50m;

    # STATIC (built assets)
    location /static/ {
      alias /home/app/web/staticfiles/;
      access_log off;
      expires 7d;
    }

    # MEDIA (uploads) — try disk first, then fall back to Django
    location /media/ {
      alias /home/app/web/media/;     # <-- must match Django MEDIA_ROOT + trailing slash
      try_files $uri $uri/ @django_media;
      expires 5m;
      add_header Cache-Control "public, max-age=300";
    }

    # Fallback handler for media (proxied to Daphne/Gunicorn on 8001)
    location @django_media {
      proxy_pass         http://127.0.0.1:8001;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_redirect     off;
    }

    # Everything else → Django app
    location / {
      proxy_pass         http://127.0.0.1:8001;
      proxy_set_header   Host $host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_redirect     off;
    }
  }
}
