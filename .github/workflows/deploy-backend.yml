name: Deploy Backend to EC2

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ai/**'
      - 'docker-compose.yml'
      - 'nginx/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          # Default command_timeout is 10m; an uncached image build (~9m) plus
          # migrations and the health-check loop exceeds it, killing the deploy
          # mid-flight before the nginx restart.
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ~/tiaago-monorepo1

            # git pull can silently no-op or fail on a diverged/detached
            # checkout without this script noticing (no error handling
            # previously existed here) -- fetch + hard-reset to the exact
            # remote ref is unconditional and can't leave stale code behind.
            # This only touches tracked files, so backend/.env (untracked,
            # holds production secrets) is left alone.
            git fetch origin main
            git reset --hard origin/main

            DEPLOYED_SHA=$(git rev-parse HEAD)
            EXPECTED_SHA="${{ github.sha }}"
            echo "Deployed SHA: $DEPLOYED_SHA (expected: $EXPECTED_SHA)"
            if [ "$DEPLOYED_SHA" != "$EXPECTED_SHA" ]; then
              echo "ERROR: checked-out commit does not match the commit that triggered this deploy."
              exit 1
            fi

            docker compose up --build -d

            echo "Waiting for web container to be healthy..."
            healthy=0
            for i in $(seq 1 30); do
              if docker compose exec -T web python -c "import urllib.request; urllib.request.urlopen('http://localhost:8000/')" 2>/dev/null; then
                echo "Web is healthy after ${i}0 seconds"
                healthy=1
                break
              fi
              echo "Attempt $i/30 - web not ready yet..."
              sleep 10
            done
            if [ "$healthy" -ne 1 ]; then
              echo "ERROR: web container never became healthy within 300s"
              exit 1
            fi

            docker compose restart nginx
            docker image prune -f
