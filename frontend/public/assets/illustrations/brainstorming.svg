<svg class="animated" id="freepik_stories-brainstorming" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 500" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:svgjs="http://svgjs.com/svgjs"><style>svg#freepik_stories-brainstorming:not(.animated) .animable {opacity: 0;}svg#freepik_stories-brainstorming.animated #freepik--background-complete--inject-145 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) lightSpeedRight;animation-delay: 0s;}svg#freepik_stories-brainstorming.animated #freepik--Shadow--inject-145 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) zoomIn;animation-delay: 0s;}svg#freepik_stories-brainstorming.animated #freepik--Floor--inject-145 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) fadeIn;animation-delay: 0s;}svg#freepik_stories-brainstorming.animated #freepik--Plant--inject-145 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) slideLeft;animation-delay: 0s;}svg#freepik_stories-brainstorming.animated #freepik--light-bulb--inject-145 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) slideDown;animation-delay: 0s;}svg#freepik_stories-brainstorming.animated #freepik--Desk--inject-145 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) lightSpeedLeft;animation-delay: 0s;}svg#freepik_stories-brainstorming.animated #freepik--character-2--inject-145 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) slideRight;animation-delay: 0s;}svg#freepik_stories-brainstorming.animated #freepik--character-3--inject-145 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) zoomOut;animation-delay: 0s;}svg#freepik_stories-brainstorming.animated #freepik--character-1--inject-145 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) slideLeft;animation-delay: 0s;}svg#freepik_stories-brainstorming.animated #freepik--Device--inject-145 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) slideLeft;animation-delay: 0s;}svg#freepik_stories-brainstorming.animated #freepik--speech-bubbles--inject-145 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) slideDown;animation-delay: 0s;}@keyframes lightSpeedRight {from {transform: translate3d(50%, 0, 0) skewX(-20deg);opacity: 0;}60% {transform: skewX(10deg);opacity: 1;}80% {transform: skewX(-2deg);}to {opacity: 1;transform: translate3d(0, 0, 0);}}@keyframes zoomIn {0% {opacity: 0;transform: scale(0.5);}100% {opacity: 1;transform: scale(1);}}@keyframes fadeIn {0% {opacity: 0;}100% {opacity: 1;}}@keyframes slideLeft {0% {opacity: 0;transform: translateX(-30px);}100% {opacity: 1;transform: translateX(0);}}@keyframes slideDown {0% {opacity: 0;transform: translateY(-30px);}100% {opacity: 1;transform: translateY(0);}}@keyframes lightSpeedLeft {from {transform: translate3d(-50%, 0, 0) skewX(20deg);opacity: 0;}60% {transform: skewX(-10deg);opacity: 1;}80% {transform: skewX(2deg);}to {opacity: 1;transform: translate3d(0, 0, 0);}}@keyframes slideRight {0% {opacity: 0;transform: translateX(30px);}100% {opacity: 1;transform: translateX(0);}}@keyframes zoomOut {0% {opacity: 0;transform: scale(1.5);}100% {opacity: 1;transform: scale(1);}}</style></svg>
