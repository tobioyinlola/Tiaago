<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background shapes -->
  <circle cx="55" cy="60" r="25" fill="#F0F2FF"/>
  <circle cx="345" cy="240" r="32" fill="#F0F2FF"/>
  <circle cx="340" cy="55" r="14" fill="#E8EBFF"/>

  <!-- Main dashboard card -->
  <rect x="90" y="40" width="220" height="200" rx="16" fill="white" filter="url(#shadow3)"/>
  <rect x="90" y="40" width="220" height="200" rx="16" stroke="#E8EBFF" stroke-width="1.5"/>

  <!-- Dashboard header bar -->
  <rect x="90" y="40" width="220" height="40" rx="16" fill="#5465FF" opacity="0.05"/>
  <rect x="90" y="64" width="220" height="16" fill="#5465FF" opacity="0.05"/>
  <circle cx="112" cy="60" r="6" fill="#5465FF" opacity="0.3"/>
  <rect x="126" y="56" width="50" height="8" rx="4" fill="#5465FF" opacity="0.15"/>

  <!-- Bar chart -->
  <g transform="translate(115, 95)">
    <rect x="0" y="55" width="22" height="65" rx="4" fill="#5465FF" opacity="0.2"/>
    <rect x="32" y="35" width="22" height="85" rx="4" fill="#5465FF" opacity="0.4"/>
    <rect x="64" y="15" width="22" height="105" rx="4" fill="#5465FF" opacity="0.7"/>
    <rect x="96" y="25" width="22" height="95" rx="4" fill="#5465FF"/>
    <rect x="128" y="45" width="22" height="75" rx="4" fill="#5465FF" opacity="0.5"/>
  </g>

  <!-- Trend line overlay -->
  <polyline points="126,140 158,130 190,108 222,115 254,128" stroke="#00B849" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <circle cx="190" cy="108" r="4" fill="#00B849"/>

  <!-- Score labels -->
  <rect x="110" y="210" width="40" height="18" rx="9" fill="#00B849" opacity="0.12"/>
  <text x="130" y="223" text-anchor="middle" fill="#00B849" font-size="9" font-weight="700" font-family="system-ui">92%</text>
  <rect x="160" y="210" width="40" height="18" rx="9" fill="#5465FF" opacity="0.12"/>
  <text x="180" y="223" text-anchor="middle" fill="#5465FF" font-size="9" font-weight="700" font-family="system-ui">87%</text>

  <!-- Floating brain icon - top right -->
  <g transform="translate(330, 110)">
    <circle r="26" fill="white" filter="url(#shadow3)"/>
    <circle r="26" stroke="#E8EBFF" stroke-width="1"/>
    <!-- Simplified brain shape -->
    <path d="M-8-8C-8-14 0-16 2-12C4-16 12-14 12-8C14-4 12 2 8 4C10 8 6 12 2 12C-2 12-6 8-4 4C-8 2-10-4-8-8Z" fill="#5465FF" opacity="0.15"/>
    <path d="M2-12V12" stroke="#5465FF" stroke-width="1.5" opacity="0.4"/>
    <path d="M-6-4C-2-2 2-2 6-4" stroke="#5465FF" stroke-width="1.5" opacity="0.3" fill="none"/>
    <path d="M-4 2C-1 4 1 4 4 2" stroke="#5465FF" stroke-width="1.5" opacity="0.3" fill="none"/>
    <!-- Neural dots -->
    <circle cx="-5" cy="-6" r="2" fill="#5465FF" opacity="0.5"/>
    <circle cx="7" cy="-6" r="2" fill="#5465FF" opacity="0.5"/>
    <circle cx="-3" cy="4" r="2" fill="#5465FF" opacity="0.5"/>
    <circle cx="5" cy="4" r="2" fill="#5465FF" opacity="0.5"/>
    <circle cx="2" cy="-1" r="2.5" fill="#5465FF" opacity="0.7"/>
  </g>

  <!-- Floating sparkle icon - bottom left -->
  <g transform="translate(65, 180)">
    <circle r="20" fill="white" filter="url(#shadow3)"/>
    <circle r="20" stroke="#E8EBFF" stroke-width="1"/>
    <path d="M0-9L2 -2L9 0L2 2L0 9L-2 2L-9 0L-2-2Z" fill="#F59E0B"/>
    <path d="M6-6L7-4L9-3L7-2L6 0L5-2L3-3L5-4Z" fill="#F59E0B" opacity="0.5"/>
  </g>

  <!-- Connecting dots -->
  <circle cx="80" cy="120" r="3" fill="#5465FF" opacity="0.12"/>
  <circle cx="335" cy="175" r="4" fill="#5465FF" opacity="0.1"/>
  <circle cx="320" cy="200" r="3" fill="#E8EBFF"/>
  <circle cx="120" cy="265" r="4" fill="#5465FF" opacity="0.08"/>
  <circle cx="280" cy="268" r="3" fill="#E8EBFF"/>

  <defs>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5465FF" flood-opacity="0.08"/>
    </filter>
  </defs>
</svg>
