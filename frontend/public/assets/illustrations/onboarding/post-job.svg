<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background decorative elements -->
  <circle cx="55" cy="55" r="30" fill="#F0F2FF"/>
  <circle cx="350" cy="245" r="40" fill="#F0F2FF"/>
  <circle cx="330" cy="50" r="18" fill="#E8EBFF"/>
  <circle cx="75" cy="240" r="12" fill="#E8EBFF"/>

  <!-- Main clipboard body -->
  <rect x="115" y="35" width="170" height="230" rx="16" fill="white" filter="url(#shadow1)"/>
  <rect x="115" y="35" width="170" height="230" rx="16" stroke="#E8EBFF" stroke-width="1.5"/>

  <!-- Clipboard clip -->
  <rect x="165" y="22" width="70" height="28" rx="14" fill="#5465FF"/>
  <circle cx="200" cy="36" r="5" fill="white" opacity="0.4"/>

  <!-- Job title line -->
  <rect x="140" y="72" width="120" height="10" rx="5" fill="#5465FF" opacity="0.2"/>
  <!-- Company line -->
  <rect x="140" y="92" width="80" height="8" rx="4" fill="#E8EBFF"/>

  <!-- Divider -->
  <line x1="140" y1="115" x2="260" y2="115" stroke="#F0F2FF" stroke-width="1.5"/>

  <!-- Description lines -->
  <rect x="140" y="128" width="120" height="6" rx="3" fill="#F3F4F6"/>
  <rect x="140" y="142" width="100" height="6" rx="3" fill="#F3F4F6"/>
  <rect x="140" y="156" width="110" height="6" rx="3" fill="#F3F4F6"/>

  <!-- Skill tags row -->
  <rect x="140" y="178" width="48" height="22" rx="11" fill="#5465FF" opacity="0.1"/>
  <text x="164" y="193" text-anchor="middle" fill="#5465FF" font-size="10" font-weight="600" font-family="system-ui">React</text>
  <rect x="196" y="178" width="36" height="22" rx="11" fill="#5465FF" opacity="0.1"/>
  <text x="214" y="193" text-anchor="middle" fill="#5465FF" font-size="10" font-weight="600" font-family="system-ui">AI</text>

  <!-- Post button -->
  <rect x="140" y="215" width="120" height="32" rx="8" fill="#5465FF"/>
  <text x="200" y="236" text-anchor="middle" fill="white" font-size="12" font-weight="600" font-family="system-ui">Post Role</text>

  <!-- Floating elements - right side -->
  <!-- Notification bell -->
  <g transform="translate(310, 100)">
    <circle r="24" fill="white" filter="url(#shadow1)"/>
    <circle r="24" stroke="#E8EBFF" stroke-width="1"/>
    <path d="M-6 -2C-6 -6.4-2.4-10 2-10S10-6.4 10-2V2C10 2 12 4 12 4H-8S-6 2-6 2Z" fill="#5465FF" opacity="0.8"/>
    <circle cx="2" cy="7" r="2.5" fill="#5465FF"/>
    <circle cx="10" cy="-8" r="4" fill="#F36174"/>
    <text x="10" y="-5" text-anchor="middle" fill="white" font-size="7" font-weight="700" font-family="system-ui">3</text>
  </g>

  <!-- Floating checkmark -->
  <g transform="translate(65, 150)">
    <circle r="20" fill="white" filter="url(#shadow1)"/>
    <circle r="20" stroke="#E8EBFF" stroke-width="1"/>
    <circle r="12" fill="#00B849" opacity="0.15"/>
    <path d="M-5 0L-1 4L7-4" stroke="#00B849" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Small decorative dots -->
  <circle cx="95" cy="85" r="4" fill="#5465FF" opacity="0.15"/>
  <circle cx="80" cy="110" r="3" fill="#5465FF" opacity="0.1"/>
  <circle cx="340" cy="175" r="5" fill="#5465FF" opacity="0.12"/>
  <circle cx="355" cy="155" r="3" fill="#5465FF" opacity="0.08"/>
  <circle cx="310" cy="195" r="3" fill="#E8EBFF"/>

  <!-- Shadow filter -->
  <defs>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5465FF" flood-opacity="0.08"/>
    </filter>
  </defs>
</svg>
