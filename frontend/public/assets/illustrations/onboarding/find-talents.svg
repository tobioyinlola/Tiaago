<svg viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background decorative circles -->
  <circle cx="340" cy="60" r="35" fill="#F0F2FF"/>
  <circle cx="60" cy="230" r="28" fill="#F0F2FF"/>
  <circle cx="50" cy="65" r="15" fill="#E8EBFF"/>

  <!-- Main magnifying glass -->
  <circle cx="190" cy="135" r="80" fill="white" filter="url(#shadow2)"/>
  <circle cx="190" cy="135" r="80" stroke="#5465FF" stroke-width="3" opacity="0.3"/>
  <circle cx="190" cy="135" r="72" stroke="#E8EBFF" stroke-width="1.5"/>

  <!-- Handle -->
  <rect x="248" y="195" width="14" height="60" rx="7" fill="#5465FF" transform="rotate(-45 255 225)"/>
  <rect x="252" y="200" width="10" height="50" rx="5" fill="#3B4CCC" transform="rotate(-45 257 225)"/>

  <!-- Person 1 - center -->
  <circle cx="190" cy="110" r="18" fill="#5465FF" opacity="0.15"/>
  <circle cx="190" cy="103" r="10" fill="#5465FF" opacity="0.6"/>
  <ellipse cx="190" cy="128" rx="16" ry="10" fill="#5465FF" opacity="0.4"/>

  <!-- Person 2 - left -->
  <circle cx="145" cy="135" r="14" fill="#E8EBFF"/>
  <circle cx="145" cy="130" r="8" fill="#5465FF" opacity="0.35"/>
  <ellipse cx="145" cy="148" rx="12" ry="7" fill="#5465FF" opacity="0.2"/>

  <!-- Person 3 - right -->
  <circle cx="235" cy="135" r="14" fill="#E8EBFF"/>
  <circle cx="235" cy="130" r="8" fill="#5465FF" opacity="0.35"/>
  <ellipse cx="235" cy="148" rx="12" ry="7" fill="#5465FF" opacity="0.2"/>

  <!-- Star badge - top right of glass -->
  <g transform="translate(260, 72)">
    <circle r="18" fill="white" filter="url(#shadow2)"/>
    <circle r="18" stroke="#E8EBFF" stroke-width="1"/>
    <path d="M0-10L2.9-3.1 10-3.1 4.5 1.8 6.9 9.5 0 5.1-6.9 9.5-4.5 1.8-10-3.1-2.9-3.1Z" fill="#F59E0B"/>
  </g>

  <!-- Verified badge - bottom left -->
  <g transform="translate(105, 200)">
    <circle r="16" fill="white" filter="url(#shadow2)"/>
    <circle r="16" stroke="#E8EBFF" stroke-width="1"/>
    <circle r="9" fill="#00B849" opacity="0.15"/>
    <path d="M-4 0L-1 3L5-3" stroke="#00B849" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Profile card floating - right -->
  <g transform="translate(310, 140)">
    <rect x="-35" y="-25" width="70" height="50" rx="10" fill="white" filter="url(#shadow2)"/>
    <rect x="-35" y="-25" width="70" height="50" rx="10" stroke="#E8EBFF" stroke-width="1"/>
    <circle cx="-12" cy="-5" r="10" fill="#5465FF" opacity="0.15"/>
    <circle cx="-12" cy="-8" r="5" fill="#5465FF" opacity="0.5"/>
    <ellipse cx="-12" cy="2" rx="8" ry="4" fill="#5465FF" opacity="0.3"/>
    <rect x="4" y="-12" width="25" height="5" rx="2.5" fill="#E8EBFF"/>
    <rect x="4" y="-2" width="18" height="4" rx="2" fill="#F3F4F6"/>
    <rect x="4" y="8" width="22" height="4" rx="2" fill="#F3F4F6"/>
  </g>

  <!-- Small dots -->
  <circle cx="90" cy="100" r="4" fill="#5465FF" opacity="0.12"/>
  <circle cx="70" cy="130" r="3" fill="#5465FF" opacity="0.08"/>
  <circle cx="320" cy="220" r="5" fill="#5465FF" opacity="0.1"/>
  <circle cx="335" cy="200" r="3" fill="#E8EBFF"/>
  <circle cx="160" cy="50" r="3" fill="#5465FF" opacity="0.15"/>

  <defs>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#5465FF" flood-opacity="0.08"/>
    </filter>
  </defs>
</svg>
