<svg class="animated" id="freepik_stories-chat-bot" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:svgjs="http://svgjs.com/svgjs"><style>svg#freepik_stories-chat-bot:not(.animated) .animable {opacity: 0;}svg#freepik_stories-chat-bot.animated #freepik--background-simple--inject-253 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) slideLeft;animation-delay: 0s;}svg#freepik_stories-chat-bot.animated #freepik--speech-bubble--inject-253 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) zoomIn;animation-delay: 0s;}svg#freepik_stories-chat-bot.animated #freepik--Screen--inject-253 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) lightSpeedLeft;animation-delay: 0s;}svg#freepik_stories-chat-bot.animated #freepik--Table--inject-253 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) lightSpeedRight;animation-delay: 0s;}svg#freepik_stories-chat-bot.animated #freepik--Character--inject-253 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) zoomIn;animation-delay: 0s;}svg#freepik_stories-chat-bot.animated #freepik--Device--inject-253 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) slideUp;animation-delay: 0s;}@keyframes slideLeft {0% {opacity: 0;transform: translateX(-30px);}100% {opacity: 1;transform: translateX(0);}}@keyframes zoomIn {0% {opacity: 0;transform: scale(0.5);}100% {opacity: 1;transform: scale(1);}}@keyframes lightSpeedLeft {from {transform: translate3d(-50%, 0, 0) skewX(20deg);opacity: 0;}60% {transform: skewX(-10deg);opacity: 1;}80% {transform: skewX(2deg);}to {opacity: 1;transform: translate3d(0, 0, 0);}}@keyframes lightSpeedRight {from {transform: translate3d(50%, 0, 0) skewX(-20deg);opacity: 0;}60% {transform: skewX(10deg);opacity: 1;}80% {transform: skewX(-2deg);}to {opacity: 1;transform: translate3d(0, 0, 0);}}@keyframes slideUp {0% {opacity: 0;transform: translateY(30px);}100% {opacity: 1;transform: inherit;}}</style></svg>
