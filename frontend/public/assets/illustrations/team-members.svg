<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 220" fill="none">
  <defs>
    <filter id="teamShadow" x="-4" y="-4" width="108%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#5465FF" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="140" cy="110" r="90" fill="#F0F2FF"/>
  <circle cx="140" cy="110" r="70" fill="#E8EBFF"/>

  <!-- Center person (admin) -->
  <g filter="url(#teamShadow)">
    <circle cx="140" cy="82" r="18" fill="#5465FF"/>
    <circle cx="140" cy="72" r="10" fill="white" opacity="0.9"/>
    <path d="M124 95 a16 12 0 0 1 32 0" fill="white" opacity="0.9"/>
  </g>

  <!-- Left person (recruiter) -->
  <g filter="url(#teamShadow)" opacity="0.85">
    <circle cx="80" cy="105" r="14" fill="#7B8AFF"/>
    <circle cx="80" cy="97" r="8" fill="white" opacity="0.9"/>
    <path d="M68 115 a12 10 0 0 1 24 0" fill="white" opacity="0.9"/>
  </g>

  <!-- Right person (viewer) -->
  <g filter="url(#teamShadow)" opacity="0.85">
    <circle cx="200" cy="105" r="14" fill="#7B8AFF"/>
    <circle cx="200" cy="97" r="8" fill="white" opacity="0.9"/>
    <path d="M188 115 a12 10 0 0 1 24 0" fill="white" opacity="0.9"/>
  </g>

  <!-- Connection lines -->
  <line x1="120" y1="88" x2="94" y2="100" stroke="#5465FF" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.3"/>
  <line x1="160" y1="88" x2="186" y2="100" stroke="#5465FF" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.3"/>

  <!-- Invite envelope icon (top right) -->
  <g transform="translate(195, 50)" filter="url(#teamShadow)">
    <rect x="0" y="0" width="32" height="24" rx="4" fill="white" stroke="#5465FF" stroke-width="1.5"/>
    <path d="M2 2 L16 14 L30 2" fill="none" stroke="#5465FF" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Plus badge -->
    <circle cx="28" cy="4" r="7" fill="#00B849"/>
    <line x1="25" y1="4" x2="31" y2="4" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="28" y1="1" x2="28" y2="7" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Verified badge (bottom left) -->
  <g transform="translate(55, 140)" filter="url(#teamShadow)">
    <circle cx="12" cy="12" r="12" fill="white"/>
    <circle cx="12" cy="12" r="8" fill="#00B849"/>
    <path d="M8 12 L11 15 L16 9" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Role badge (bottom right) -->
  <g transform="translate(190, 145)" filter="url(#teamShadow)">
    <rect x="0" y="0" width="48" height="20" rx="10" fill="white"/>
    <rect x="4" y="4" width="12" height="12" rx="6" fill="#5465FF"/>
    <text x="21" y="14" font-family="sans-serif" font-size="8" font-weight="600" fill="#5465FF">Admin</text>
  </g>

  <!-- Sparkle decorations -->
  <g fill="#5465FF" opacity="0.2">
    <circle cx="60" cy="55" r="3"/>
    <circle cx="225" cy="160" r="2.5"/>
    <circle cx="105" cy="160" r="2"/>
    <circle cx="175" cy="50" r="2"/>
  </g>
</svg>
