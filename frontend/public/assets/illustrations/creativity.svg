<svg class="animated" id="freepik_stories-creativity" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 500 500" version="1.1" xmlns:svgjs="http://svgjs.com/svgjs"><style>svg#freepik_stories-creativity:not(.animated) .animable {opacity: 0;}svg#freepik_stories-creativity.animated #freepik--Gears--inject-29 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) zoomOut;animation-delay: 0s;}svg#freepik_stories-creativity.animated #freepik--Rocket--inject-29 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) zoomIn;animation-delay: 0s;}svg#freepik_stories-creativity.animated #freepik--light-bulb--inject-29 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) lightSpeedRight;animation-delay: 0s;}svg#freepik_stories-creativity.animated #freepik--paint-tube--inject-29 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) slideRight;animation-delay: 0s;}svg#freepik_stories-creativity.animated #freepik--Photos--inject-29 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) slideUp;animation-delay: 0s;}svg#freepik_stories-creativity.animated #freepik--music-icons--inject-29 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) zoomOut;animation-delay: 0s;}svg#freepik_stories-creativity.animated #freepik--paper-plane--inject-29 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) fadeIn;animation-delay: 0s;}svg#freepik_stories-creativity.animated #freepik--Character--inject-29 {animation: 1s 1 forwards cubic-bezier(.36,-0.01,.5,1.38) slideRight;animation-delay: 0s;}@keyframes zoomOut {0% {opacity: 0;transform: scale(1.5);}100% {opacity: 1;transform: scale(1);}}@keyframes zoomIn {0% {opacity: 0;transform: scale(0.5);}100% {opacity: 1;transform: scale(1);}}@keyframes lightSpeedRight {from {transform: translate3d(50%, 0, 0) skewX(-20deg);opacity: 0;}60% {transform: skewX(10deg);opacity: 1;}80% {transform: skewX(-2deg);}to {opacity: 1;transform: translate3d(0, 0, 0);}}@keyframes slideRight {0% {opacity: 0;transform: translateX(30px);}100% {opacity: 1;transform: translateX(0);}}@keyframes slideUp {0% {opacity: 0;transform: translateY(30px);}100% {opacity: 1;transform: inherit;}}@keyframes fadeIn {0% {opacity: 0;}100% {opacity: 1;}}</style></svg>
