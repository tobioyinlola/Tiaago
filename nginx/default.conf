upstream django {
    server web:8000;
}

upstream ai_service {
    server ai:8000;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name api.tiaago.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name api.tiaago.com;

    ssl_certificate /etc/letsencrypt/live/api.tiaago.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.tiaago.com/privkey.pem;

    if ($host != api.tiaago.com) {
        return 444;
    }

    client_max_body_size 10m;

    # Maintenance page on backend downtime
    error_page 502 503 504 /maintenance.html;
    location = /maintenance.html {
        root /var/www/maintenance;
        internal;
    }

    # Static files
    location /static/ {
        alias /var/www/staticfiles/;
        access_log off;
        expires 7d;
    }

    # Media files
    location /media/ {
        alias /var/www/media/;
        expires 5m;
        add_header Cache-Control "public, max-age=300";
    }

    # WebSocket connections
    location /ws/ {
        proxy_pass http://django;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # All other requests to Django
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }
}
