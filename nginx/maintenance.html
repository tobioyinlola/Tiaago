<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>We'll Be Right Back | TIAAGO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #F3F4F6;
    color: #1C3477;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container {
    text-align: center;
    max-width: 520px;
    padding: 40px 24px;
  }
  .logo {
    width: 140px;
    margin: 0 auto 32px;
  }
  .illustration {
    width: 280px;
    height: 280px;
    margin: 0 auto 32px;
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    color: #1C3477;
    margin-bottom: 12px;
    line-height: 1.3;
  }
  p {
    font-size: 16px;
    line-height: 1.6;
    color: #5F6264;
    margin-bottom: 32px;
  }
  .status-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #EEF0FF;
    border: 1px solid #C7CCFF;
    border-radius: 100px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 500;
    color: #5465FF;
  }
  .pulse {
    width: 10px;
    height: 10px;
    background: #5465FF;
    border-radius: 50%;
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }
  .footer {
    margin-top: 48px;
    font-size: 13px;
    color: #98A2B3;
  }
  .footer a {
    color: #5465FF;
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="container">
  <!-- TIAAGO Logo -->
  <img
    class="logo"
    src="https://www.tiaago.com/assets/images/logo-dark.png"
    alt="TIAAGO"
    onerror="this.style.display='none'"
  />

  <!-- Maintenance Illustration (inline SVG) -->
  <svg class="illustration" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background circle -->
    <circle cx="200" cy="200" r="160" fill="#EEF0FF"/>
    <!-- Server rack -->
    <rect x="130" y="120" width="140" height="180" rx="12" fill="#1C3477"/>
    <rect x="130" y="120" width="140" height="180" rx="12" stroke="#5465FF" stroke-width="2"/>
    <!-- Server slots -->
    <rect x="146" y="140" width="108" height="32" rx="4" fill="#2E4585"/>
    <rect x="146" y="184" width="108" height="32" rx="4" fill="#2E4585"/>
    <rect x="146" y="228" width="108" height="32" rx="4" fill="#2E4585"/>
    <!-- Blinking lights -->
    <circle cx="160" cy="156" r="5" fill="#5465FF">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="176" cy="156" r="5" fill="#3E92CC"/>
    <circle cx="160" cy="200" r="5" fill="#5465FF">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="176" cy="200" r="5" fill="#3E92CC"/>
    <circle cx="160" cy="244" r="5" fill="#FFB800">
      <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="176" cy="244" r="5" fill="#3E92CC"/>
    <!-- Drive indicators -->
    <rect x="220" y="148" width="20" height="4" rx="2" fill="#5465FF" opacity="0.5"/>
    <rect x="220" y="156" width="20" height="4" rx="2" fill="#5465FF" opacity="0.3"/>
    <rect x="220" y="192" width="20" height="4" rx="2" fill="#5465FF" opacity="0.5"/>
    <rect x="220" y="200" width="20" height="4" rx="2" fill="#5465FF" opacity="0.3"/>
    <rect x="220" y="236" width="20" height="4" rx="2" fill="#FFB800" opacity="0.5"/>
    <rect x="220" y="244" width="20" height="4" rx="2" fill="#FFB800" opacity="0.3"/>
    <!-- Wrench -->
    <g transform="translate(280, 100) rotate(30)">
      <rect x="0" y="30" width="14" height="60" rx="3" fill="#98A2B3"/>
      <circle cx="7" cy="18" r="18" fill="none" stroke="#98A2B3" stroke-width="8"/>
      <circle cx="7" cy="18" r="10" fill="#EEF0FF"/>
    </g>
    <!-- Gear -->
    <g transform="translate(90, 240)">
      <circle cx="20" cy="20" r="14" fill="none" stroke="#5465FF" stroke-width="6"/>
      <circle cx="20" cy="20" r="6" fill="#EEF0FF"/>
      <rect x="16" y="0" width="8" height="8" rx="2" fill="#5465FF"/>
      <rect x="16" y="32" width="8" height="8" rx="2" fill="#5465FF"/>
      <rect x="0" y="16" width="8" height="8" rx="2" fill="#5465FF"/>
      <rect x="32" y="16" width="8" height="8" rx="2" fill="#5465FF"/>
      <animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="8s" repeatCount="indefinite" additive="sum"/>
    </g>
    <!-- Progress dots -->
    <circle cx="170" cy="340" r="6" fill="#5465FF">
      <animate attributeName="opacity" values="1;0.2;0.2" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="196" cy="340" r="6" fill="#5465FF">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="222" cy="340" r="6" fill="#5465FF">
      <animate attributeName="opacity" values="0.2;0.2;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
  </svg>

  <h1>Upgrading Our Systems</h1>
  <p>We're making TIAAGO even better. This usually takes less than 5 minutes. Your data is safe and everything will be right where you left it.</p>

  <div class="status-badge">
    <span class="pulse"></span>
    Deployment in progress
  </div>

  <div class="footer">
    <p>Questions? <a href="mailto:support@tiaago.com">support@tiaago.com</a></p>
  </div>
</div>
</body>
</html>
