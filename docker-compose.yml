x-logging: &logtail-logging
  driver: "fluentd"
  options:
    fluentd-address: "localhost:24224"
    fluentd-async: "true"
    tag: "docker.{{.Name}}"

services:
  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    environment:
      - ROLE=web
      - PORT=8000
      - ENV=production
      - DEBUG=0
      - MIGRATE_ON_START=1
    expose:
      - "8000"
    volumes:
      - static_files:/home/app/web/staticfiles
      - media_files:/home/app/web/media
    depends_on:
      - ai
      - vector
    restart: unless-stopped
    logging: *logtail-logging

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    environment:
      - ROLE=worker
      - ENV=production
      - DEBUG=0
      - CELERY_CONCURRENCY=2
      - CELERY_MAX_TASKS_PER_CHILD=100
      - CELERY_LOGLEVEL=info
    depends_on:
      - web
      - vector
    restart: unless-stopped
    logging: *logtail-logging

  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: ./backend/.env
    environment:
      - ROLE=beat
      - ENV=production
      - DEBUG=0
      - CELERY_LOGLEVEL=info
    depends_on:
      - web
      - vector
    restart: unless-stopped
    logging: *logtail-logging

  ai:
    build:
      context: ./ai
      dockerfile: Dockerfile
    env_file: ./ai/.env
    expose:
      - "8000"
    depends_on:
      - vector
    restart: unless-stopped
    logging: *logtail-logging

  vector:
    image: timberio/vector:0.41.1-alpine
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
    environment:
      - LOGTAIL_SOURCE_TOKEN=${LOGTAIL_SOURCE_TOKEN}
    ports:
      - "24224:24224"
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/var/www/staticfiles:ro
      - media_files:/var/www/media:ro
      - certbot_www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - web
      - ai
    restart: unless-stopped

volumes:
  static_files:
  media_files:
  certbot_www:
